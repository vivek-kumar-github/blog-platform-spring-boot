<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Philosite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container" style="max-width: 420px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary display-5"></i>
                    <h2 class="fw-bold mt-2 mb-1">Create Account</h2>
                    <p class="text-muted small mb-0">Join the Philosite community today</p>
                </div>

                <div th:if="${registrationError}" class="alert alert-danger py-2" role="alert">
                    <p class="m-0 small" th:text="${registrationError}"></p>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" id="username" th:field="*{username}" class="form-control"
                                placeholder="Choose a username" required autofocus>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}"
                            th:errors="*{username}">Username Error</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                placeholder="Create a strong password" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}">Password Error</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register</button>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted">Already have an account? <a th:href="@{/login}"
                            class="text-decoration-none">Log in here</a></small>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
