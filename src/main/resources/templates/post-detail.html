<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${post.title}">Post Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .post-content {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-arrow-left me-2"></i>Back to Feed</a>
    </div>
  </nav>

  <main class="container my-4" style="max-width: 800px;">

    <article class="card shadow-sm border-0 rounded-3 mb-4">
      <div class="card-body p-4 p-md-5">
        <h1 class="fw-bold mb-3" th:text="${post.title}">Post Title</h1>
        <div class="text-muted small mb-4 pb-3 border-bottom d-flex align-items-center gap-3">
          <span><i class="bi bi-person-fill me-1"></i><strong
              th:text="${post.user != null ? post.user.username : 'Anonymous'}">Author</strong></span>
          <span><i class="bi bi-clock me-1"></i><span
              th:text="${#temporals.format(post.createdAt, 'dd MMMM, yyyy')}">Date</span></span>
        </div>

        <div class="post-content text-dark" th:text="${post.content}">
          Full blog content goes here...
        </div>
      </div>
    </article>

    <section class="card shadow-sm border-0 rounded-3 mb-4">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-chat-left-text me-2"></i>Comments</h4>

        <div th:if="${post.comments != null and !post.comments.isEmpty()}" class="d-flex flex-column gap-3">
          <div th:each="comment : ${post.comments}" class="p-3 bg-light rounded-3 border-start border-primary border-3">
            <p class="mb-2 text-dark" th:text="${comment.content}" style="white-space: pre-line;">Comment text goes
              here.</p>
            <div class="text-muted small d-flex justify-content-between align-items-center">
              <span>By: <strong
                  th:text="${comment.user != null ? comment.user.username : 'Anonymous'}">Username</strong></span>
              <span th:text="${#temporals.format(comment.createdAt, 'dd MMM, yyyy HH:mm')}">Date</span>
            </div>
          </div>
        </div>

        <div th:if="${post.comments.isEmpty()}" class="text-center py-4 text-muted">
          <i class="bi bi-chat-square-dots display-6"></i>
          <p class="mt-2 mb-0">No comments yet. Be the first to share your thoughts!</p>
        </div>
      </div>
    </section>

    <section class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-3">Leave a Reply</h5>

        <div sec:authorize="isAuthenticated()">
          <form th:action="@{/posts/{postId}/comments(postId=${post.id})}" th:object="${newComment}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
              <textarea id="comment-content" th:field="*{content}" class="form-control" rows="4"
                placeholder="Write your comment here..." required></textarea>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Comment
                Error</div>
            </div>
            <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-1">
              <i class="bi bi-send"></i> Submit Comment
            </button>
          </form>
        </div>

        <div sec:authorize="isAnonymous()" class="alert alert-info mb-0">
          <i class="bi bi-info-circle me-1"></i>
          Please <a th:href="@{/login}" class="alert-link">log in</a> to participate in the discussion.
        </div>
      </div>
    </section>

  </main>

</body>

</html>
