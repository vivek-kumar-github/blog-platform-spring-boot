<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 640px;
        }

        h1 {
            font-size: 5rem;
            font-weight: 300;
            margin: 0;
            color: #fd7e14;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #6c757d;
        }

        p {
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .primary {
            background: #0d6efd;
            color: #fff;
        }

        .secondary {
            background: #fff;
            border-color: #ced4da;
            color: #343a40;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>403</h1>
        <h2>Access Denied</h2>
        <p th:if="${param.expired}">Your session expired after logout in another tab. Please log in again to continue.
        </p>
        <p th:unless="${param.expired}">Your request could not be completed because your session may have expired or you
            do not have permission.</p>

        <div class="actions">
            <a class="primary" th:href="@{/login}">Log In Again</a>
            <a class="secondary" th:href="@{/}">Go to Homepage</a>
        </div>
    </div>
</body>

</html>
