<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Philosite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container" style="max-width: 420px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-sm-5">
                <h2 class="text-center fw-bold mb-4">Log in</h2>

                <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                    You have been logged out.
                </div>
                <div th:if="${param.expired}" class="alert alert-warning py-2" role="alert">
                    Your session expired. Please log in and try again.
                </div>
                <div th:if="${registrationSuccess}" class="alert alert-success py-2" role="alert">
                    <p class="m-0" th:text="${registrationSuccess}"></p>
                </div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted">Don't have an account? <a th:href="@{/register}"
                            class="text-decoration-none">Register here</a></small>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
