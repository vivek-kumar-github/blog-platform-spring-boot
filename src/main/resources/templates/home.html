<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloggy - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .post-card {
            transition: transform 0.2s ease, shadow 0.2s ease;
            border: none;
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08) !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i
                    class="bi bi-journal-richtext text-primary me-2"></i>Bloggy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/}">Home</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/posts}">Dashboard</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                        <span class="text-light small">Welcome, <strong sec:authentication="name">User</strong></span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </div>
                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">Login</a>
                        <a th:href="@{/register}" class="btn btn-primary btn-sm">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-2" style="max-width: 900px;">

        <div class="card shadow-sm p-4 mb-4 bg-white rounded-3">
            <div class="row align-items-center">
                <div class="col-md-6 mb-3 mb-md-0">
                    <h2 class="fw-bold mb-1">Explore Insights</h2>
                    <p class="text-muted mb-0">Discover posts shared by our community.</p>
                </div>
                <div class="col-md-6">
                    <form th:action="@{/}" method="get" class="d-flex gap-2">
                        <input type="text" name="keyword" th:value="${param.keyword}" class="form-control"
                            placeholder="Search articles..." />
                        <button type="submit" class="btn btn-primary d-flex align-items-center gap-1">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${postPage.hasContent()}" class="d-flex flex-column gap-3">
            <article th:each="post : ${postPage.content}" class="card post-card shadow-sm rounded-3">
                <div class="card-body p-4">
                    <h3 class="card-title h4 fw-bold mb-2">
                        <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"
                            class="text-decoration-none text-dark">Post Title</a>
                    </h3>
                    <p class="card-text text-secondary mb-3" th:text="${#strings.abbreviate(post.content, 220)}">
                        Post snippet preview text goes here...
                    </p>
                    <div class="d-flex justify-content-between align-items-center text-muted small border-top pt-3">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-circle"></i>
                            <span th:text="${post.user.username}">Author Name</span>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <i class="bi bi-calendar3"></i>
                            <span th:text="${#temporals.format(post.createdAt, 'dd MMM, yyyy')}">Date</span>
                        </div>
                    </div>
                </div>
            </article>
        </div>

        <div th:if="${!postPage.hasContent()}" class="text-center py-5">
            <i class="bi bi-journal-x text-muted display-1"></i>
            <h4 class="mt-3 text-secondary">No articles found</h4>
            <p class="text-muted">Try adjusting your search criteria or check back later.</p>
        </div>

        <nav aria-label="Pagination" th:if="${postPage.totalPages > 1}" class="mt-5">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${postPage.isFirst()} ? 'disabled' : ''">
                    <a class="page-link"
                        th:href="${!postPage.isFirst()} ? @{/(page=${postPage.number - 1}, keyword=${keyword})} : '#'">
                        &laquo; Prev
                    </a>
                </li>
                <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, postPage.totalPages - 1)}"
                    th:classappend="${pageNum == postPage.number} ? 'active' : ''">
                    <a class="page-link" th:href="@{/(page=${pageNum}, keyword=${keyword})}"
                        th:text="${pageNum + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${postPage.isLast()} ? 'disabled' : ''">
                    <a class="page-link"
                        th:href="${!postPage.isLast()} ? @{/(page=${postPage.number + 1}, keyword=${keyword})} : '#'">
                        Next &raquo;
                    </a>
                </li>
            </ul>
        </nav>

    </main>

    <script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
