<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Philosite Dashboard</a>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">View Website</a>
        </div>
    </nav>

    <main class="container" style="max-width: 1000px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">Post Management</h2>
            <a th:href="@{/admin/posts/new}" class="btn btn-primary d-flex align-items-center gap-1">
                <i class="bi bi-plus-circle"></i> Create New Post
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-0">
                <div th:if="${!posts.isEmpty()}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4">ID</th>
                                <th>Title</th>
                                <th>Created At</th>
                                <th class="text-end px-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="post : ${posts}">
                                <td class="px-4 text-muted" th:text="${post.id}">1</td>
                                <td><strong th:text="${post.title}">My First Post</strong></td>
                                <td class="text-muted"
                                    th:text="${#temporals.format(post.createdAt, 'dd MMM, yyyy HH:mm')}">04-Aug-2026
                                </td>
                                <td class="text-end px-4">
                                    <a th:href="@{/admin/posts/edit/{id}(id=${post.id})}"
                                        class="btn btn-sm btn-outline-warning me-1">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/posts/delete/{id}(id=${post.id})}" method="post"
                                        class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}"
                                            th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this post?');">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${posts.isEmpty()}" class="text-center py-5 text-muted">
                    <p class="mb-0">No posts found in database.</p>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
