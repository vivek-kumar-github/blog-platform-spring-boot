<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-4">

    <main class="container" style="max-width: 800px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold mb-4" th:text="${post.id == null} ? 'Create New Post' : 'Edit Post'">Manage Post</h2>

                <form th:action="@{/admin/posts}" th:object="${post}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Post Title</label>
                        <input type="text" th:field="*{title}" id="title" class="form-control form-control-lg"
                            placeholder="Enter post title..." required />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                            Title Error</div>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fw-bold">Post Content</label>
                        <textarea th:field="*{content}" id="content" class="form-control" rows="10"
                            placeholder="Write your full post content here..." required></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}"
                            th:errors="*{content}">Content Error</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Post</button>
                        <a th:href="@{/admin/posts}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>

</html>
